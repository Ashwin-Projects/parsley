services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "127.0.0.1:${PARSLEY_WEB_PORT:-8080}:80"
    restart: unless-stopped
    # Deliberately independent: the static UI can start while the API is offline.

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file:
      - path: .env
        required: false
    environment:
      PARSLEY_CLIENT_IP_HEADER: X-Real-IP # nginx sets it; without it every visitor counts as nginx
    expose:
      - "8000"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
